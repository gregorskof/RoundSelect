name: Deploy RoundSelect (Angular)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Detect GitHub Pages base href
        id: pagespath
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "base_href=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_href=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build website
        run: npm run build -- --configuration production --base-href "/"
      - name: Preserve direct links and avoid Jekyll
        run: |
          touch dist/roundselect/browser/.nojekyll
          cp dist/roundselect/browser/index.html dist/roundselect/browser/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/roundselect/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
